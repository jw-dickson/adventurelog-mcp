[project]
name = "adventurelog-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants plan trips in AdventureLog"
authors = [
    { name = "jw-dickson", email = "184026387+jw-dickson@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.scripts]
adventurelog-mcp = "adventurelog_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
